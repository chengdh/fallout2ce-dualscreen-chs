; Chinese font pack configuration for Fallout2Ce-Dualscreen-Android.
;
; INSTALL
;   1. Copy this file to  <your game data>/fonts/chs/font.ini
;      (Android: the folder you selected in the import wizard; it is the one
;       containing master.dat / critter.dat / data/).
;   2. Copy a Chinese TrueType font (.ttf or .ttc, glyf outlines - NOT CFF/OTF)
;      into the same folder and name it chs.ttf, or change "fileName" below.
;      Common choices: simhei.ttf, simsun.ttc, msyh.ttc, SourceHanSansSC.ttf.
;      fileName may also be an absolute path such as /sdcard/fonts/chs.ttf.
;   3. Put the Chinese translation's text/ folder in the same game data dir
;      and set [system] language=chinese in fallout2.cfg.
;   4. Restart the game. On success the log shows
;      "CHS: Chinese TrueType fonts enabled (encoding GBK)".
;      If the font file is missing the game silently keeps the stock fonts.
;
; ENCODING
;   encoding=GBK     - the Chinese Fallout translations (default, CP936).
;   encoding=UTF-8   - for UTF-8 translated text files.
;
; TUNING
;   maxHeight    - glyph pixel size. The engine asks for several font ids
;                  (100..110); ids without a section here use the nearest
;                  defined size.
;   lineSpacing  - extra pixels between lines.
;   heightOffset - added to line height; use a NEGATIVE value when Chinese
;                  text crowds the inventory / character sheet / save slots
;                  (fallout1-ce-chs hardcoded those screens to 12 px; here
;                  it is configurable rather than compiled in).
;   wordSpacing  - width of a space / fallback glyph width.
;   letterSpacing- extra pixels after every character.
;   warpMode=1   - never break at a character boundary, only at spaces.
;                  Keep 0 for Chinese.

[font0]
maxHeight=12
maxWidth=12
lineSpacing=2
wordSpacing=6
letterSpacing=0
heightOffset=0
warpMode=0
encoding=GBK
fileName=chs.ttf

